[package]
name = "nuxtor"
version = "1.6.0"
description = "Starter template for Nuxt 4 and Tauri 2"
authors = ["NicolaSpadari"]
license = "MIT"
repository = "https://github.com/NicolaSpadari/nuxtor"
edition = "2024"
rust-version = "1.90"

[lib]
name = "nuxtor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
tauri = { version = "2.12.4", features = ["tray-icon"] }
tauri-plugin-fs = "2.7.1"
tauri-plugin-notification = "2.7.0"
tauri-plugin-opener = "2.7.2"
tauri-plugin-os = "2.4.0"
tauri-plugin-shell = "2.5.0"
tauri-plugin-store = "2.5.0"

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
